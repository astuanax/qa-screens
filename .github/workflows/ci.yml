name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.10", "3.12", "3.14"]
    env:
      QA_SCREENS_ERROR_REPORTING: local
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ matrix.python }}
      - run: uv pip install -e ".[dev]"
      - run: python -m playwright install --with-deps chromium
      - run: pytest -q

  # A new user's first run: clean machine, no Chromium, no config, installed from the wheel.
  first-run:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      QA_SCREENS_ERROR_REPORTING: local
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - run: uv build
      - name: Install the built wheel (no playwright install step on purpose)
        shell: bash
        run: uv pip install "$(ls dist/*.whl)[dev]"
      - run: pytest -q -m first_run tests/test_first_run.py -p no:cacheprovider
